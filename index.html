</style></head><body>
<header><h1>Obesity: Evaluation and Management</h1><p>Based on Harrison’s Principles of Internal Medicine, Ch. 402 (Kushner). Clinical decision support; not a substitute for clinical judgment.</p></header>
<nav id="nav"></nav><main id="m"></main>
<script>
var S={tab:0,w:"",h:"",waist:"",sex:"F",eth:"eu",asia:false,ci:[],imp:5,conf:5,fail:false,preg:false,mtc:false,drug:"phen",wk:12,loss:"",hx:[]};
var TABS=["Assess","Plan","Drugs","Surgery","Reference","Knowledge Base"];
var CI=[["Pre-hypertension",1],["Hepatic steatosis",1],["OSA with AHI 5–30 and mild symptoms",1],["Osteoarthritis, WOMAC 1–5",1],["Prediabetes",2],["Metabolic syndrome",2],["Type 2 diabetes",2],["NASH",2],["Hypertension",2],["OSA with symptoms or AHI >30",2],["Osteoarthritis, WOMAC 5–10 or knee replacement surgery",2],["Other obesity-related condition (CAD, HF, PCOS, GERD, etc.)",1]];
var HX=["Hypothyroidism","Cushing’s syndrome","Polycystic ovary syndrome","Hypothalamic disease","Insulin, sulfonylurea or thiazolidinedione","Steroids","Clozapine, olanzapine, risperidone","Lithium","Tricyclics, MAOIs, paroxetine, mirtazapine","Valproate, gabapentin, carbamazepine"];
var CUT={eu:[94,80,"Europeans"],sa:[90,80,"South Asian and Chinese"],jp:[85,90,"Japanese"]};
var DR={phen:["Phentermine/topiramate ER",3,12,"Assess at 12 weeks: if <3% loss, escalate dose and reassess at 6 months, or stop."],nb:["Naltrexone SR/bupropion SR",5,16,"Assess at 16 weeks: stop if <5% loss."],lira:["Liraglutide 3.0 mg",4,16,"Assess at 16 weeks: stop if <4% loss."]};
function bmi(){var w=+S.w,h=+S.h/100;return w>0&&h>0?w/(h*h):0}
function cls(b){var o=S.asia?[18.5,23,25,30]:[18.5,25,30,35,40];
 if(b<18.5)return["Underweight","—"];
 if(S.asia){return b<23?["Healthy weight","—"]:b<25?["Overweight (Asia-Pacific)","Increased"]:b<30?["Obesity class I (Asia-Pacific)","High"]:["Obesity class II+ (Asia-Pacific)","Very high"]}
 return b<25?["Healthy weight","—"]:b<30?["Overweight","Increased"]:b<35?["Obesity class I","High"]:b<40?["Obesity class II","Very high"]:["Extreme obesity class III","Extremely high"]}
function stage(){var t=0;S.ci.forEach(function(i){t=Math.max(t,CI[i][1])});return t}
function g(id){return document.getElementById(id)}
function set(k,v,r){S[k]=v;if(r!==false)render()}
function tg(k,i){var a=S[k],p=a.indexOf(i);p<0?a.push(i):a.splice(p,1);render()}
function render(){
 g("nav").innerHTML=TABS.map(function(t,i){return'<button class="'+(i==S.tab?"on":"")+'" onclick="S.tab='+i+';render();scrollTo(0,0)">'+t+'</button>'}).join("");
 g("m").innerHTML=[A,P,D,SU,R,K][S.tab]();
}
function A(){var b=bmi(),h='<div class="card"><h2>Measurements</h2><div class="row"><div><label>Weight (kg)</label><input type="number" inputmode="decimal" value="'+S.w+'" onchange="set(\'w\',this.value)"></div><div><label>Height (cm)</label><input type="number" inputmode="decimal" value="'+S.h+'" onchange="set(\'h\',this.value)"></div><div><label>Waist (cm), horizontal plane above iliac crest</label><input type="number" inputmode="decimal" value="'+S.waist+'" onchange="set(\'waist\',this.value)"></div><div><label>Sex</label><select onchange="set(\'sex\',this.value)"><option value="F"'+(S.sex=="F"?" selected":"")+'>Female</option><option value="M"'+(S.sex=="M"?" selected":"")+'>Male</option></select></div></div>'
 +'<label>Ethnic group (waist cutoffs, Table 402-2)</label><select onchange="set(\'eth\',this.value)">'+Object.keys(CUT).map(function(k){return'<option value="'+k+'"'+(S.eth==k?" selected":"")+'>'+CUT[k][2]+'</option>'}).join("")+'</select>'
 +'<div class="chk"><input type="checkbox" id="as" '+(S.asia?"checked":"")+' onchange="set(\'asia\',this.checked)"><label for="as" style="margin:0;color:var(--ink)">Use lower Asia-Pacific BMI thresholds (23 / 25 / 30; text notes lower cutoffs are proposed, exact values from WHO Asia-Pacific)</label></div></div>';
 if(b){var c=cls(b),cu=CUT[S.eth],wc=+S.waist,lim=S.sex=="M"?cu[0]:cu[1];
 h+='<div class="card"><h2>Result</h2><div class="big">BMI '+b.toFixed(1)+'</div><span class="tag">'+c[0]+'</span><span class="tag '+(c[1]=="—"?"":"w")+'">Disease risk: '+c[1]+'</span>'
 +(wc?'<p>Waist '+wc+' cm vs cutoff >'+lim+' cm: <b>'+(wc>lim?"excess abdominal fat, higher risk of metabolic syndrome, diabetes, CVD":"within cutoff")+'</b>.</p>':'')+'</div>'}
 h+='<div class="card"><h2>Obesity-related complications (Fig. 402-1, Table 402-3)</h2><p class="note">Tick what is present. For all patients: fasting lipid profile, chemistry, HbA1c and BP.</p>'+CI.map(function(c,i){return'<div class="chk"><input type="checkbox" id="c'+i+'" '+(S.ci.indexOf(i)>=0?"checked":"")+' onchange="tg(\'ci\','+i+')"><label for="c'+i+'" style="margin:0;color:var(--ink)">'+c[0]+'</label></div>'}).join("")+'</div>'
 +'<div class="card"><h2>Secondary and drug-induced causes</h2><p class="note">Most obesity is behavioral; screen the history for these.</p>'+HX.map(function(c,i){return'<div class="chk"><input type="checkbox" id="h'+i+'" '+(S.hx.indexOf(i)>=0?"checked":"")+' onchange="tg(\'hx\','+i+')"><label for="h'+i+'" style="margin:0;color:var(--ink)">'+c+'</label></div>'}).join("")+(S.hx.length?'<div class="alert">Consider targeted evaluation or medication review for the ticked cause(s). NSAIDs and calcium channel blockers cause edema but not fat gain.</div>':'')+'</div>'
 +'<div class="card"><h2>Readiness to change</h2><p class="note">Anchoring: rate 0 (not at all) to 10 (very).</p><label>Importance: '+S.imp+'</label><input type="range" min="0" max="10" value="'+S.imp+'" oninput="set(\'imp\',+this.value)" style="width:100%"><label>Confidence: '+S.conf+'</label><input type="range" min="0" max="10" value="'+S.conf+'" oninput="set(\'conf\',+this.value)" style="width:100%"><div class="chk"><input type="checkbox" id="f" '+(S.fail?"checked":"")+' onchange="set(\'fail\',this.checked)"><label for="f" style="margin:0;color:var(--ink)">Diet and activity therapy alone has not been successful</label></div>'
 +'<div class="chk"><input type="checkbox" id="pg" '+(S.preg?"checked":"")+' onchange="set(\'preg\',this.checked)"><label for="pg" style="margin:0;color:var(--ink)">Woman of childbearing potential</label></div><div class="chk"><input type="checkbox" id="mt" '+(S.mtc?"checked":"")+' onchange="set(\'mtc\',this.checked)"><label for="mt" style="margin:0;color:var(--ink)">Personal or family history of medullary thyroid cancer or MEN2</label></div>'
 +'<button class="pri" onclick="S.tab=1;render();scrollTo(0,0)">See management plan</button></div>';return h}
function P(){var b=bmi();if(!b)return'<div class="card">Enter weight and height on the Assess tab first.</div>';
 var com=S.ci.length>0,st=stage(),wt=+S.w,c=cls(b);
 var d=b>=25&&(b>=30||com),ph=b>=30||(b>=27&&com),su=b>=40||(b>=35&&com);
 var ready=S.imp>=7&&S.conf>=7,h='<div class="card"><h2>BMI '+b.toFixed(1)+' · '+c[0]+'</h2><p>Disease stage: <b>'+["0 (no complications)","1 (mild-moderate complications)","2 (severe complications)"][st]+'</b>. '+["Treat to prevent complications (secondary prevention); suggested therapy: lifestyle.","Treat complications; lifestyle, and consider medication.","Treat complications; lifestyle plus medication, and consider surgery."][st]+'</p>'
 +(b<25?'<div class="alert">BMI below 25: advise avoiding weight gain, address other risk factors, and recheck weight and BMI annually or more often.</div>':'')+'</div>';
 if(b>=25){h+='<div class="card"><h2>Treatment options (Table 402-4)</h2><table><tr><th>Option</th><th>Indicated?</th></tr><tr><td>Diet, exercise, behavior therapy</td><td class="'+(d?"y":"")+'">'+(d?"Yes":"Not by BMI category (BMI 25–26.9 needs comorbidity)")+'</td></tr><tr><td>Pharmacotherapy</td><td class="'+(ph?"y":"")+'">'+(ph?"Yes, as an adjunct"+(S.fail||b>=30?"":" if lifestyle fails"):"No")+'</td></tr><tr><td>Bariatric surgery</td><td class="'+(su?"y":"")+'">'+(su?"Consider referral":"No")+'</td></tr></table>';
 h+='<p class="note">Medication: BMI ≥30, or ≥27 with comorbidity when diet and activity have not worked. Surgery: BMI ≥40, or ≥35 with comorbidity, as an adjunct to lifestyle.</p></div>';
 h+='<div class="card"><h2>Readiness</h2>'+(ready?'<p><span class="tag">Ready</span> Set weight-loss and health goals and start comprehensive lifestyle intervention.</p>':'<p><span class="tag w">Not yet ready</span> Use motivational interviewing; explore resistance, stressors, psychiatric status, time and expectations. Reassess later.</p>')+'</div>';
 var lo=Math.round(wt*.08),hi=Math.round(wt*.10);
 h+='<div class="card"><h2>Lifestyle prescription</h2><ul><li><b>Goal:</b> lose 8–10% in 6 months, about '+lo+'–'+hi+' kg for you ('+(wt-hi).toFixed(0)+'–'+(wt-lo).toFixed(0)+' kg). Use SMART goals.</li><li><b>Calories:</b> deficit of 500–750 kcal/d, or '+(S.sex=="M"?"1500–1800":"1200–1500")+' kcal/d (about 1–2 lb/week).</li><li><b>Diet quality:</b> more fruit, vegetables, whole grains, fiber; lean meat, skimmed dairy; fewer fried foods and sugary drinks; sodium <2300 mg/d; added sugars and saturated fat <10% of calories. Low energy-density foods help. Meal replacements give about 7–8% loss.</li><li><b>Activity:</b> 150 min/week moderate (or 75 min vigorous), spread through the week; >300 min/week helps sustain loss. Pedometer, stairs, brisk walking. Reduce sedentary time.</li><li><b>Behavior:</b> self-monitoring, stimulus control, social support, problem solving, cognitive restructuring; record planned changes (what, when, where, how). Refer to a dietitian.</li><li>Lifestyle alone typically gives 3–5 kg.</li></ul>'
 +'<p class="note">VLCD (≤800 kcal/d, 13–23 kg in 3–6 months): only for motivated moderate-severe obesity with failed conservative care and a medical need for rapid loss (poorly controlled T2D, hypertriglyceridemia, OSA, symptomatic edema), under medical supervision.</p></div>';
 if(ph){h+='<div class="card"><h2>Medication cautions</h2>';if(S.preg)h+='<div class="alert">Phentermine/topiramate: fetal oral-cleft risk. Negative pregnancy test before and monthly, with effective contraception.</div>';if(S.mtc)h+='<div class="alert">Liraglutide (GLP-1 agonist) should not be prescribed with a family or personal history of medullary thyroid cancer or MEN2.</div>';h+='<p class="note">Give drugs only alongside a lifestyle program. See the Drugs tab for options and the response check.</p></div>'}}
 if(su)h+='<div class="card"><h2>Surgery</h2><p>Refer to an experienced bariatric surgeon for evaluation (see Surgery tab). Operative mortality is generally <1%.</p></div>';
 h+='<div class="card"><h2>Follow-up</h2><p>Weight loss ≥5% with sufficient improvement in health targets: continue follow-up and weight-loss maintenance, and measure weight and BMI regularly. Otherwise: intensive behavioral treatment, reassess contributing medical factors, consider adding or re-evaluating pharmacotherapy, and/or refer for bariatric surgery.</p></div>';return h}
function D(){var x=DR[S.drug],l=+S.loss,r="";
 if(S.loss!==""){var ok=l>=x[1];r='<div class="alert">'+(ok?'Responder: loss of '+l+'% meets the ≥'+x[1]+'% target. Continue.':'Loss of '+l+'% is below the ≥'+x[1]+'% target. '+x[3])+'</div>'}
 return'<div class="card"><h2>Response check</h2><label>Drug</label><select onchange="set(\'drug\',this.value)">'+Object.keys(DR).map(function(k){return'<option value="'+k+'"'+(S.drug==k?" selected":"")+'>'+DR[k][0]+'</option>'}).join("")+'</select><label>% body weight lost at assessment point</label><input type="number" inputmode="decimal" value="'+S.loss+'" onchange="set(\'loss\',this.value)">'+r+'<p class="note">'+x[3]+' Early response predicts 1-year success.</p></div>'
 +'<div class="card"><h2>Antiobesity medications</h2><details open><summary>Orlistat (peripherally acting)</summary><p>120 mg tid with meals. Blocks about 30% of dietary fat absorption. 1-year loss ~9–10% vs 4–6% placebo. Minimal systemic absorption. Effects: flatus with discharge, fecal urgency, oily stool; psyllium helps. Give a vitamin supplement (D, E, β-carotene may fall). OTC since 2007.</p></details>'
 +'<details><summary>Phentermine and phentermine/topiramate ER</summary><p>Phentermine (sympathomimetic) is the most prescribed, with limited long-term data (0.6–6 kg more than placebo over 2–24 weeks). Side effects: restlessness, insomnia, dry mouth, constipation, higher BP and heart rate. PHEN/TPM: 1-year placebo-subtracted loss 9.3% (15/92 mg, EQUIP) and 6.6% (7.5/46 mg, CONQUER). Adverse: paresthesias, dry mouth, constipation, dysgeusia, insomnia. Teratogenic risk.</p></details>'
 +'<details><summary>Naltrexone SR/bupropion SR</summary><p>8/90 mg tablets, bid. Placebo-subtracted 1-year loss 4.8%, 5.1%, 4.2% (COR-I, COR-II, COR-BMOD). Slight BP and pulse increases vs placebo. Adverse: nausea, constipation, headache, vomiting, dizziness, diarrhea, insomnia, dry mouth.</p></details>'
 +'<details><summary>Liraglutide 3.0 mg SC daily</summary><p>GLP-1 analogue (97% homology). Placebo-subtracted 1-year loss 5.4% (SCALE) and 6.1% (SCALE Maintenance). Small heart-rate rise. Adverse: nausea, diarrhea, constipation, vomiting. Avoid with personal/family medullary thyroid cancer or MEN2.</p></details>'
 +'<details><summary>Lorcaserin (withdrawn)</summary><p>5-HT2C agonist, approved 2012, withdrawn Feb 2020 after a trial showed more cancers (7.7% vs 7.1%). Placebo-subtracted loss 3.6% and 3.0%.</p></details>'
 +'<details><summary>Oral device: Gelesis100</summary><p>Cellulose gel capsule (FDA 2019) that expands in the stomach. BMI 25 or more. Placebo-subtracted loss 2.1% (6.4 vs 4.4%) over 24 weeks. No increased safety risks.</p></details>'
 +'<details><summary>Intragastric balloons</summary><p>REHAPE, ORBERA (endoscopic) and OBALON (swallowed). Approved for up to 6 months in BMI 30–40. 6-month loss 9.7% (5.6% control-subtracted). Adverse: nausea, vomiting, abdominal pain.</p></details></div>'}
function SU(){return'<div class="card"><h2>Bariatric surgery</h2><p>Consider for BMI ≥40, or ≥35 with comorbidity. Benefits arise from gut hormone, bile acid, microbiota and adipose changes, plus caloric restriction.</p><div class="tw"><table><tr><th>Procedure</th><th>Type</th><th>Key points</th></tr><tr><td>Adjustable gastric banding</td><td>Restrictive</td><td>Adjustable band; 20–25% loss at 5 y; often abandoned. No malabsorption.</td></tr><tr><td>Sleeve gastrectomy</td><td>Restrictive</td><td>~80% of greater curvature removed; loss superior to banding.</td></tr><tr><td>Roux-en-Y gastric bypass</td><td>Restrictive-malabsorptive</td><td>Most common and accepted; laparoscopic.</td></tr><tr><td>BPD ± duodenal switch</td><td>Restrictive-malabsorptive</td><td>More malabsorption.</td></tr></table></div>'
 +'<ul><li>Bypass procedures: 30–35% weight loss at 12–18 months, then variable regain.</li><li>Meta-analysis: reduced global mortality (OR 0.55), CV death (0.58), all-cause mortality (0.70).</li><li>Swedish Obese Subjects: 78% lower incidence of T2D. 68.2% had complete T2D remission within 5 years, but one-third relapsed. Best in early, shorter-duration, non-insulin, lower HbA1c disease.</li><li>Complications: stomal stenosis or marginal ulcers (5–15%); treat with endoscopic dilation and acid suppression.</li><li>Lifelong B12, iron, folate, calcium, vitamin D for restrictive-malabsorptive procedures.</li></ul></div>'}
function R(){return'<div class="card"><h2>BMI classes (Table 402-1)</h2><table><tr><th>Class</th><th>BMI</th><th>Disease risk</th></tr><tr><td>Underweight</td><td><18.5</td><td>—</td></tr><tr><td>Healthy</td><td>18.5–24.9</td><td>—</td></tr><tr><td>Overweight</td><td>25–29.9</td><td>Increased</td></tr><tr><td>Obesity I</td><td>30–34.9</td><td>High</td></tr><tr><td>Obesity II</td><td>35–39.9</td><td>Very high</td></tr><tr><td>Obesity III</td><td>≥40</td><td>Extremely high</td></tr></table></div>'
 +'<div class="card"><h2>Waist cutoffs (Table 402-2)</h2><table><tr><th>Group</th><th>Men</th><th>Women</th></tr><tr><td>Europeans</td><td>>94 cm</td><td>>80 cm</td></tr><tr><td>South Asians, Chinese</td><td>>90 cm</td><td>>80 cm</td></tr><tr><td>Japanese</td><td>>85 cm</td><td>>90 cm</td></tr></table><p class="note">Other groups: use South Asian (Central/South American) or European data (sub-Saharan African, Eastern Mediterranean) until specific data exist.</p></div>'
 +'<div class="card"><h2>Four steps of evaluation</h2><ul><li>Focused history: diet, activity, sleep, stress. Use neutral words (weight, BMI) rather than "obesity" or "fatness".</li><li>Examination for degree and type of obesity (BMI, waist).</li><li>Assess comorbidities and staging (AACE/ACE; EOSS 0–4 is an alternative).</li><li>Assess readiness.</li></ul><p>Seven history questions: contributing factors; health effects; risk level; difficulties; goals; motivation; help needed. Physical fitness predicts mortality independent of BMI.</p></div>'
 +'<div class="card"><h2>Sleep and stress</h2><p>Short sleep is linked to metabolic change, appetite dysregulation, sympathetic overactivity and insulin sensitivity changes. Stress may raise cortisol through adrenal-cortical activation.</p></div>'}
S.f={};S.q="";
var FL=[["cvd","Established cardiovascular disease"],["dm","Type 2 diabetes"],["osa","Moderate-severe obstructive sleep apnea"],["mash","MASH with stage 2–3 fibrosis"],["mig","Migraine"],["smk","Smoker, untreated depression or alcohol use disorder"],["cost","Cost or coverage barrier"],["oral","Prefers an oral drug"],["pg2","Pregnant, lactating or planning pregnancy"],["gi","Severe IBD or gastroparesis"],["panc","History of pancreatitis"],["hcv","Coronary disease, uncontrolled hypertension, hyperthyroidism, glaucoma, MAOI use or substance use disorder"],["sz","Seizure disorder, bulimia, chronic opioid use or severe renal/hepatic disease"]];
function tgf(k){S.f[k]=!S.f[k];render()}
function rec(){var f=S.f,o=[],glp=!(S.mtc||f.pg2||f.gi);
 if(glp){
  if(f.oral)o.push("<b>Oral GLP-1:</b> oral semaglutide 25 mg (empty stomach, ≤120 mL water, wait ≥30 min before food or other pills) is preferred; orforglipron is an alternative with no food restrictions (check CYP3A4 interactions).");
  if(f.cvd)o.push("<b>Established CVD:</b> subcutaneous semaglutide has proven CV benefit with or without diabetes (SELECT: events 6.5% vs 8%). Tirzepatide and liraglutide have proof only with diabetes.");
  if(f.osa)o.push("<b>OSA:</b> tirzepatide is approved for moderate-severe OSA with obesity.");
  if(f.mash)o.push("<b>MASH:</b> semaglutide is FDA-approved for stage 2–3 fibrosis; tirzepatide also improves MASH outcomes.");
  if(f.dm)o.push("<b>Diabetes:</b> tirzepatide has the greatest glycemic efficacy. Reduce insulin or sulfonylurea dose in the first 4 weeks and self-monitor glucose daily during titration.");
  if(f.cost)o.push("<b>Cost:</b> generic semaglutide is now sold in India. Do not use compounded products. If no GLP-1 agent is accessible, use the alternatives below.");
  if(!f.oral&&!f.cvd&&!f.osa&&!f.mash)o.push("<b>First choice for maximum loss:</b> tirzepatide (about −19% in network meta-analysis; 72-week head-to-head 22.8 vs 15 kg) or subcutaneous semaglutide 2.4 mg (about −11.7%; 7.2 mg is superior to 2.4 mg).");
  if(f.panc)o.push("<b>Pancreatitis history:</b> use caution; only if the cause has been reversed (for example after cholecystectomy).");
